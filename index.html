<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>토토인테리어 마스터 견적 시스템 Pro v2.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        * { box-sizing: border-box; }
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; color: #0f172a; margin: 0; padding: 0; }
        :root { --toto-navy: #0f172a; --toto-blue: #2563eb; --toto-slate: #64748b; }
        
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .category-tab.active { background-color: var(--toto-blue); color: white; border-color: var(--toto-blue); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25); }
        
        .print-page { width: 210mm; min-height: 297mm; padding: 20mm; margin: 40px auto; background: white; border: 1px solid #e2e8f0; display: flex; flex-direction: column; }
        @media print { 
            .no-print { display: none !important; } 
            body { background: white; } 
            .print-page { margin: 0; padding: 15mm; width: 210mm; height: 296.5mm; border: none; page-break-after: always; }
            .print-page.auto-height { height: auto !important; page-break-after: auto; }
        }

        .detail-table th { background-color: #f8fafc; border: 1px solid #94a3b8; padding: 10px 4px; font-weight: 800; font-size: 11px; }
        .detail-table td { border: 1px solid #cbd5e1; padding: 8px 6px; font-size: 11px; }
        .category-row { background-color: #fdfdfd; font-weight: 900; color: var(--toto-blue); border-top: 2px solid var(--toto-navy); }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="antialiased overflow-x-hidden">
    <div class="no-print flex flex-col">
        <nav class="bg-[#0f172a] text-white p-4 sticky top-0 z-50 shadow-xl">
            <div class="max-w-[1800px] mx-auto flex justify-between items-center">
                <div class="flex items-center space-x-4">
                    <h1 class="text-2xl font-black italic tracking-tighter shrink-0">TOTO <span class="text-blue-500 font-bold uppercase">Pro</span></h1>
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-widest hidden lg:inline">v2.1 Sheet Integration</span>
                </div>
                <div class="flex items-center space-x-4">
                    <button onclick="app.saveToLocal()" class="bg-slate-700 px-4 py-2 rounded-xl font-bold text-xs">저장</button>
                    <button onclick="app.loadFromLocal()" class="bg-slate-600 px-4 py-2 rounded-xl font-bold text-xs">불러오기</button>
                    <div id="nav-total" class="text-xl font-black text-white px-4">0원</div>
                    <button onclick="window.print()" class="bg-blue-600 px-6 py-2.5 rounded-xl font-bold text-sm">공식 견적서 발행</button>
                </div>
            </div>
        </nav>

        <main class="max-w-[1800px] mx-auto p-4 md:p-8 grid grid-cols-1 lg:grid-cols-12 gap-8 w-full">
            <div class="lg:col-span-8 space-y-6">
                <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="md:col-span-2 space-y-4">
                        <div>
                            <label class="text-[10px] font-black text-slate-400 uppercase">현장 주소 / 고객명</label>
                            <input type="text" id="site-name" oninput="app.updateAll()" class="w-full mt-1 bg-slate-50 rounded-xl p-4 font-bold outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div class="grid grid-cols-3 gap-4">
                            <div>
                                <label class="text-[10px] font-black text-slate-400 uppercase">공사 평수</label>
                                <input type="number" id="site-size" value="30" onchange="app.syncAutoCalculations()" class="w-full mt-1 bg-slate-50 rounded-xl p-4 font-bold outline-none">
                            </div>
                            <div class="col-span-2 flex items-end gap-3 pb-2">
                                <label class="flex items-center gap-2 cursor-pointer bg-slate-50 p-4 rounded-xl border border-slate-100 hover:bg-slate-100 transition-all flex-1">
                                    <input type="checkbox" id="env-elevator" checked onchange="app.syncAutoCalculations()" class="w-5 h-5 accent-blue-600">
                                    <span class="text-xs font-bold text-slate-700">승강기 있음</span>
                                </label>
                                <label class="flex items-center gap-2 cursor-pointer bg-slate-50 p-4 rounded-xl border border-slate-100 hover:bg-slate-100 transition-all flex-1">
                                    <input type="checkbox" id="env-occupied" onchange="app.syncAutoCalculations()" class="w-5 h-5 accent-blue-600">
                                    <span class="text-xs font-bold text-slate-700">거주 중 현장</span>
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="bg-slate-50 rounded-2xl p-6 space-y-3">
                        <div class="grid grid-cols-2 gap-3">
                            <div><label class="text-[10px] font-bold text-slate-500">경비(%)</label><input type="number" id="rate-exp" value="5" oninput="app.updateAll()" class="w-full bg-white rounded-lg p-2 text-center font-bold"></div>
                            <div><label class="text-[10px] font-bold text-slate-500">이윤(%)</label><input type="number" id="rate-profit" value="10" oninput="app.updateAll()" class="w-full bg-white rounded-lg p-2 text-center font-bold"></div>
                        </div>
                        <div><label class="text-[10px] font-bold text-slate-500">단수 조정(원)</label><input type="number" id="val-adjust" value="0" oninput="app.updateAll()" class="w-full bg-white rounded-lg p-2 text-right font-bold"></div>
                    </div>
                </div>

                <div class="bg-white rounded-[2.5rem] shadow-sm border border-slate-200 overflow-hidden">
                    <div class="bg-slate-50 p-4 border-b flex flex-wrap gap-2" id="category-tabs"></div>
                    <div class="p-6 bg-white border-b flex justify-between items-center gap-4">
                        <input type="text" id="db-search" onkeyup="app.renderDB()" placeholder="항목 및 코드 검색..." class="flex-1 text-xs border rounded-full px-6 py-3 outline-none focus:border-blue-500">
                        <button onclick="app.fetchExternalData()" id="sync-btn" class="bg-blue-50 text-blue-700 px-5 py-3 rounded-full text-xs font-black">🔄 데이터 동기화</button>
                    </div>
                    <div class="h-[550px] overflow-y-auto custom-scroll">
                        <table class="w-full text-left text-xs">
                            <thead class="bg-slate-50 sticky top-0 z-10"><tr class="text-slate-400 font-bold uppercase"><th class="p-6">품명 및 제품 스펙</th><th class="p-6 text-center">단위</th><th class="p-6 text-right">단가</th><th class="p-6 text-center">로직</th><th class="p-6 text-center">추가</th></tr></thead>
                            <tbody id="db-tbody" class="divide-y divide-slate-100"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-4 space-y-6">
                <div class="bg-white rounded-[2.5rem] shadow-xl border border-slate-200 overflow-hidden sticky top-24">
                    <div class="p-8 bg-blue-600 text-white flex justify-between items-end">
                        <div>
                            <div class="text-[10px] font-bold opacity-60 uppercase mb-1">Estimated Total</div>
                            <div id="side-total" class="text-3xl font-black italic">0원</div>
                        </div>
                        <div class="text-right">
                            <div class="text-[10px] font-bold opacity-60 uppercase mb-1">Items</div>
                            <div id="side-count" class="text-2xl font-black">0</div>
                        </div>
                    </div>
                    <div id="selected-list" class="p-4 max-h-[450px] overflow-y-auto custom-scroll space-y-3 bg-slate-50/50"></div>
                    <div class="p-6 bg-white border-t"><canvas id="budgetChart" height="180"></canvas></div>
                </div>
            </div>
        </main>
    </div>

    <div id="print-container" class="hidden">
        <section class="print-page">
            <div class="flex justify-center border-b-[8px] border-slate-900 pb-3 mb-12"><h1 class="text-4xl font-black tracking-[1.5em]">견 적 서</h1></div>
            <div class="grid grid-cols-2 gap-12 mb-16 text-sm">
                <div class="space-y-6">
                    <div class="flex border-b border-slate-300 pb-2"><span class="w-20 font-black text-slate-400">Client</span><span id="p1-client" class="font-black flex-1"></span></div>
                    <div class="flex border-b border-slate-300 pb-2"><span class="w-20 font-black text-slate-400">Date</span><span id="p1-date" class="font-bold"></span></div>
                </div>
                <div class="border-[2px] border-slate-900 p-3">
                    <table class="w-full text-xs">
                        <tr><td class="font-bold py-1">상 호</td><td class="font-black">토토인테리어</td></tr>
                        <tr><td class="font-bold py-1">성 명</td><td class="font-black text-right">이 병 복 (인)</td></tr>
                        <tr><td class="font-bold py-1">사업장</td><td class="text-xs">분당구 내정로173번길 11 102호</td></tr>
                    </table>
                </div>
            </div>
            <div class="bg-slate-50 p-10 border-y-[4px] border-slate-900">
                <div class="flex justify-between items-center">
                    <div class="text-2xl font-black text-slate-400">Grand Total</div>
                    <div class="text-right"><span id="p1-hangeul" class="text-xl font-bold text-blue-800"></span><div id="p1-total" class="text-5xl font-black mt-2">0</div></div>
                </div>
            </div>
        </section>
        <section class="print-page auto-height">
            <h2 class="text-xl font-black border-b-2 border-slate-900 mb-6 pb-2 uppercase">Detailed Estimate</h2>
            <table id="p3-table" class="w-full border-collapse detail-table">
                <thead><tr><th class="w-10">No</th><th class="w-48 text-left pl-2">품명</th><th class="text-left pl-2">상세 규격</th><th class="w-12">단위</th><th class="w-12">수량</th><th class="w-24 text-right pr-2">단가</th><th class="w-32 text-right pr-2">금액</th></tr></thead>
            </table>
        </section>
    </div>

    <script>
        const app = {
            // 주군이 주신 구글 시트 ID와 GID를 적용한 데이터 URL
            sheetUrl: "https://docs.google.com/spreadsheets/d/1jaPhEZG9OIoHiTU-Cm6hK3M43FjG-IOWlggzqN8tb3k/export?format=csv&gid=995460540",
            MASTER_DB: [],
            selectedItems: [],
            budgetChart: null,
            activeCategory: "가설/철거",

            fetchExternalData: async function() {
                const btn = document.getElementById('sync-btn');
                btn.innerHTML = "⏳ 시트 데이터 로딩 중...";
                try {
                    const response = await fetch(app.sheetUrl);
                    if (!response.ok) throw new Error("시트 접근 권한이 없거나 주소가 잘못되었습니다. (공유 설정을 확인하세요)");
                    const csvText = await response.text();
                    const rows = app.parseCSV(csvText);
                    
                    app.MASTER_DB = rows.slice(1).map(cols => ({
                        itemCode: cols[0],
                        cat: cols[1],
                        name: cols[2],
                        spec: cols[3],
                        unit: cols[5],
                        price: parseFloat(cols[6]?.replace(/[^0-9.-]+/g,"")) || 0,
                        formula: cols[7] || "1",
                        viewMode: cols[8] || "NORMAL",
                        summaryGroup: cols[10] || "기타공종"
                    })).filter(i => i.name);
                    
                    app.renderTabs();
                    app.renderDB();
                    app.showNotification('최신 구글 시트 연동 성공', 'success');
                } catch (e) {
                    alert('시트 연동 오류: ' + e.message + '\n\n시트가 [링크가 있는 모든 사용자에게 뷰어]로 공유되어 있는지 확인해주세요.');
                } finally {
                    btn.innerHTML = "🔄 데이터 동기화";
                }
            },

            evaluateFormula: function(formula, context) {
                try {
                    let expression = formula
                        .replace(/\[SIZE\]/g, context.size)
                        .replace(/\[ELEVATOR\]/g, `'${context.elevator}'`)
                        .replace(/\[OCCUPIED\]/g, `'${context.occupied}'`)
                        .replace(/\[INPUT\]/g, "1");
                    return eval(expression) || 0;
                } catch (e) { return 1; }
            },

            addItem: function(code) {
                const item = app.MASTER_DB.find(i => i.itemCode === code);
                if (!item || app.selectedItems.some(s => s.itemCode === code)) return;
                const context = {
                    size: parseFloat(document.getElementById('site-size').value) || 0,
                    elevator: document.getElementById('env-elevator').checked ? 'Y' : 'N',
                    occupied: document.getElementById('env-occupied').checked ? 'Y' : 'N'
                };
                app.selectedItems.push({ ...item, qty: app.evaluateFormula(item.formula, context), finalPrice: item.price });
                app.updateAll();
            },

            syncAutoCalculations: function() {
                const context = {
                    size: parseFloat(document.getElementById('site-size').value) || 0,
                    elevator: document.getElementById('env-elevator').checked ? 'Y' : 'N',
                    occupied: document.getElementById('env-occupied').checked ? 'Y' : 'N'
                };
                app.selectedItems.forEach(item => {
                    item.qty = app.evaluateFormula(item.formula, context);
                });
                app.updateAll();
            },

            updateAll: function() {
                app.renderSelectedList();
                app.updateChart();
                app.updatePrintView();
            },

            renderSelectedList: function() {
                const list = document.getElementById('selected-list');
                list.innerHTML = '';
                let directTotal = 0;
                app.selectedItems.forEach(item => {
                    const subTotal = item.qty * item.finalPrice;
                    directTotal += subTotal;
                    list.innerHTML += `
                        <div class="flex justify-between items-center p-4 bg-white border rounded-2xl shadow-sm">
                            <div class="min-w-0 flex-1">
                                <div class="text-[9px] font-black text-blue-600 uppercase">${item.itemCode}</div>
                                <div class="text-xs font-black truncate">${item.name}</div>
                                <div class="text-[10px] text-slate-500">${item.qty} ${item.unit} x ${item.finalPrice.toLocaleString()}원</div>
                            </div>
                            <div class="flex items-center gap-2">
                                <input type="number" value="${item.qty}" onchange="app.updateItemQty('${item.itemCode}', this.value)" class="w-12 bg-slate-100 rounded p-1 text-xs text-center font-bold">
                                <button onclick="app.removeItem('${item.itemCode}')" class="text-slate-300">✕</button>
                            </div>
                        </div>`;
                });
                const total = directTotal + (directTotal * (parseFloat(document.getElementById('rate-exp').value)/100)) + (directTotal * (parseFloat(document.getElementById('rate-profit').value)/100)) + (parseInt(document.getElementById('val-adjust').value) || 0);
                document.getElementById('side-total').textContent = Math.round(total).toLocaleString() + '원';
                document.getElementById('nav-total').textContent = Math.round(total).toLocaleString() + '원';
                document.getElementById('side-count').textContent = app.selectedItems.length;
            },

            updatePrintView: function() {
                document.getElementById('p1-client').textContent = document.getElementById('site-name').value;
                document.getElementById('p1-date').textContent = new Date().toLocaleDateString();
                const p3Table = document.getElementById('p3-table');
                p3Table.querySelectorAll('tbody').forEach(b => b.remove());
                const grouped = app.selectedItems.reduce((acc, item) => { if (!acc[item.cat]) acc[item.cat] = []; acc[item.cat].push(item); return acc; }, {});
                Object.keys(grouped).forEach((cat, idx) => {
                    const tbody = document.createElement('tbody');
                    let html = `<tr class="category-row"><td class="text-center font-bold">${idx+1}</td><td colspan="6" class="font-black text-blue-800">${cat}</td></tr>`;
                    grouped[cat].forEach(item => {
                        const amount = item.qty * item.finalPrice;
                        const vQty = item.viewMode.includes('FIXED_SET') ? 1 : item.qty;
                        const vUnit = item.viewMode.includes('FIXED_SET') ? '식' : item.unit;
                        const vPrice = item.viewMode.includes('FIXED_SET') ? amount : item.finalPrice;
                        html += `<tr><td></td><td class="font-black">${item.name}</td><td class="text-[9px]">${item.spec}</td><td class="text-center">${vUnit}</td><td class="text-center font-black">${vQty}</td><td class="text-right">${vPrice.toLocaleString()}</td><td class="text-right font-black">${amount.toLocaleString()}</td></tr>`;
                    });
                    tbody.innerHTML = html;
                    p3Table.appendChild(tbody);
                });
            },

            parseCSV: function(text) {
                return text.split('\n').map(row => {
                    let fields = [], field = '', inQuotes = false;
                    for (let char of row) {
                        if (char === '"') inQuotes = !inQuotes;
                        else if (char === ',' && !inQuotes) { fields.push(field.trim()); field = ''; }
                        else field += char;
                    }
                    fields.push(field.trim());
                    return fields;
                });
            },

            renderTabs: function() {
                const container = document.getElementById('category-tabs');
                const cats = [...new Set(app.MASTER_DB.map(i => i.cat))];
                container.innerHTML = '';
                cats.forEach(c => {
                    const btn = document.createElement('button');
                    btn.className = `category-tab px-4 py-2 rounded-xl text-[11px] font-black border-2 ${app.activeCategory === c ? 'active' : ''}`;
                    btn.textContent = c;
                    btn.onclick = () => { app.activeCategory = c; app.renderTabs(); app.renderDB(); };
                    container.appendChild(btn);
                });
            },

            renderDB: function() {
                const tbody = document.getElementById('db-tbody');
                const search = document.getElementById('db-search').value.toLowerCase();
                const filtered = app.MASTER_DB.filter(i => i.cat === app.activeCategory && (i.name.toLowerCase().includes(search) || i.itemCode.toLowerCase().includes(search)));
                tbody.innerHTML = '';
                filtered.forEach(item => {
                    tbody.innerHTML += `
                        <tr class="hover:bg-blue-50 cursor-pointer" onclick="app.addItem('${item.itemCode}')">
                            <td class="p-6">
                                <div class="text-[9px] font-black text-blue-600 mb-1">${item.itemCode}</div>
                                <div class="font-bold text-sm">${item.name}</div>
                                <div class="text-[10px] text-slate-500">${item.spec}</div>
                            </td>
                            <td class="p-6 text-center font-bold">${item.unit}</td>
                            <td class="p-6 text-right font-black">${item.price.toLocaleString()}</td>
                            <td class="p-6 text-center text-[10px] text-blue-500 font-bold">${item.formula}</td>
                            <td class="p-6 text-center"><button class="bg-blue-600 text-white w-8 h-8 rounded-lg">＋</button></td>
                        </tr>`;
                });
            },

            updateItemQty: function(code, val) { const item = app.selectedItems.find(s => s.itemCode === code); if (item) { item.qty = parseFloat(val) || 0; app.updateAll(); } },
            removeItem: function(code) { app.selectedItems = app.selectedItems.filter(s => s.itemCode !== code); app.updateAll(); },
            showNotification: function(m) { console.log(m); },
            saveToLocal: function() { localStorage.setItem('toto_v2_sheet', JSON.stringify(app.selectedItems)); },
            loadFromLocal: function() { const saved = localStorage.getItem('toto_v2_sheet'); if(saved) { app.selectedItems = JSON.parse(saved); app.updateAll(); } },
            updateChart: function() {}, 
            initChart: function() {}
        };

        window.onload = () => { app.fetchExternalData(); };
    </script>
</body>
</html>
