<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOTO Pro - 인테리어 영업 지원 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        * { box-sizing: border-box; }
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; color: #0f172a; margin: 0; padding: 0; }
        :root { --toto-navy: #0f172a; --toto-blue: #2563eb; --toto-slate: #64748b; }
        
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .category-tab.active { background-color: var(--toto-blue); color: white; border-color: var(--toto-blue); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25); }
        .mode-tab.active { background-color: var(--toto-blue) !important; color: white !important; border-color: var(--toto-blue) !important; }
        .m-card { transition: all 0.2s ease-out; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        @media print { 
            .no-print { display: none !important; } 
            body { background: white; margin: 0; padding: 0; } 
            .print-page { margin: 0; border: none; width: 210mm; height: 297mm; page-break-after: always; display: flex; flex-direction: column; } 
        }
        
        .room-card { transition: transform 0.2s; border: 2px solid transparent; }
        .room-card:hover { transform: translateY(-2px); border-color: var(--toto-blue); }
    </style>
</head>
<body class="antialiased overflow-x-hidden">
    <div class="no-print flex flex-col">
        <!-- 상단 네비게이션 -->
        <nav class="bg-[#0f172a] text-white p-4 sticky top-0 z-50 shadow-xl">
            <div class="max-w-[1800px] mx-auto flex justify-between items-center">
                <div class="flex items-center space-x-4">
                    <h1 class="text-2xl font-black italic tracking-tighter shrink-0">TOTO <span class="text-blue-500 font-bold uppercase">Pro</span></h1>
                    <div class="h-6 w-px bg-slate-700"></div>
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest hidden lg:inline">Sales Intelligence v13.0</span>
                </div>
                <div class="flex items-center space-x-6">
                    <div id="sync-status" class="hidden text-[10px] bg-green-500/20 text-green-400 px-3 py-1 rounded-full border border-green-500/30 font-bold">● CLOUD CONNECTED</div>
                    <div class="text-right hidden md:block">
                        <div class="text-[10px] font-bold text-slate-500 uppercase italic">Estimated Grand Total</div>
                        <div id="nav-total" class="text-xl lg:text-2xl font-black text-white">0원</div>
                    </div>
                    <button onclick="window.print()" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2.5 rounded-xl font-bold text-sm shadow-lg transition-all">공식 견적서 발행</button>
                </div>
            </div>
        </nav>

        <main class="max-w-[1800px] mx-auto p-4 md:p-8 grid grid-cols-1 lg:grid-cols-12 gap-8 w-full">
            <!-- 왼쪽: 데이터 제어 및 검색 영역 -->
            <div class="lg:col-span-8 space-y-6">
                <!-- 현장 주소 및 평수 입력 (영업의 시작) -->
                <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="md:col-span-2 space-y-4">
                        <div>
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">현장 주소 / 고객명</label>
                            <input type="text" id="site-name" oninput="app.debounceUpdate()" placeholder="예: 분당 정자동 파크뷰 301동 홍길동님" class="w-full mt-1 bg-slate-50 border-none rounded-xl p-4 font-bold text-slate-800 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div class="grid grid-cols-3 gap-4">
                            <div>
                                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">공사 평수</label>
                                <div class="relative">
                                    <input type="number" id="site-size" onchange="app.syncAutoCalculations()" placeholder="32" class="w-full mt-1 bg-slate-50 border-none rounded-xl p-4 font-bold text-slate-800 outline-none">
                                    <span class="absolute right-4 top-5 text-xs font-bold text-slate-400">평</span>
                                </div>
                            </div>
                            <div class="col-span-2">
                                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">면적 산출 타입 (확장 계수)</label>
                                <div class="flex gap-2 mt-1">
                                    <button onclick="app.setAreaType('normal')" id="area-type-normal" class="flex-1 area-type-btn active bg-blue-500 text-white rounded-xl p-2.5 font-bold text-[10px] transition-all">📐 기본형</button>
                                    <button onclick="app.setAreaType('extended')" id="area-type-extended" class="flex-1 area-type-btn bg-white text-slate-600 border border-slate-200 rounded-xl p-2.5 font-bold text-[10px] transition-all">📏 확장형(1.15x)</button>
                                </div>
                                <div class="mt-2 flex justify-between items-center px-1">
                                    <span class="text-[9px] font-bold text-slate-400 uppercase">Actual Calculation Area</span>
                                    <span class="text-[11px] font-black text-blue-600"><span id="actual-size-display">0</span>평 적용</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- 경비 및 이윤 설정 -->
                    <div class="bg-slate-50 rounded-2xl p-6 space-y-3 border border-slate-100 shadow-inner">
                        <div class="grid grid-cols-2 gap-3">
                            <div><label class="text-[10px] font-bold text-slate-500">경비(%)</label><input type="number" id="rate-exp" value="5" oninput="app.debounceUpdate()" class="w-full mt-1 bg-white border border-slate-200 rounded-lg p-2 text-center font-bold text-sm outline-none"></div>
                            <div><label class="text-[10px] font-bold text-slate-500">이윤(%)</label><input type="number" id="rate-profit" value="10" oninput="app.debounceUpdate()" class="w-full mt-1 bg-white border border-slate-200 rounded-lg p-2 text-center font-bold text-sm outline-none"></div>
                        </div>
                        <div><label class="text-[10px] font-bold text-slate-500 italic">Target Budget (상담 목표가)</label><input type="number" id="meeting-budget" value="0" placeholder="50,000,000" class="w-full mt-1 bg-white border border-slate-200 rounded-lg p-2 text-right font-black text-sm text-blue-700 outline-none"></div>
                    </div>
                </div>

                <!-- 자재 선택 모듈 -->
                <div class="bg-white rounded-[2.5rem] shadow-sm border border-slate-200 overflow-hidden">
                    <div class="bg-slate-50 p-4 border-b">
                        <div class="flex gap-3 mb-4">
                            <button onclick="app.switchMode('meeting')" id="mode-meeting" class="mode-tab flex-1 px-6 py-4 rounded-2xl text-sm font-black transition-all border-2">01. DIGITAL MEETING SHEET</button>
                            <button onclick="app.switchMode('search')" id="mode-search" class="mode-tab flex-1 px-6 py-4 rounded-2xl text-sm font-black transition-all border-2 active">02. ITEM MASTER DATABASE</button>
                        </div>
                        <div id="search-mode-tabs" class="flex flex-wrap gap-2 overflow-x-auto pb-1 custom-scroll"></div>
                    </div>
                    
                    <div id="search-mode-content">
                        <div class="p-6 bg-white border-b flex flex-col md:flex-row justify-between items-center gap-4">
                            <h2 class="font-black text-slate-800 text-sm uppercase tracking-widest flex items-center">
                                <span class="w-2 h-5 bg-blue-600 rounded-full mr-3"></span>Items in <span id="active-cat-name" class="ml-2 text-blue-600 italic">가설/철거</span>
                            </h2>
                            <div class="flex gap-2 w-full md:w-auto">
                                <input type="text" id="db-search" onkeyup="app.debounceRenderDB()" placeholder="품명 검색..." class="flex-1 md:w-64 text-xs border border-slate-200 rounded-full px-6 py-3 outline-none focus:border-blue-500 shadow-sm">
                                <button onclick="app.fetchExternalData()" id="sync-btn" class="bg-blue-50 text-blue-700 px-5 py-3 rounded-full text-xs font-black transition-all border border-blue-100 flex items-center shrink-0">🔄 동기화</button>
                            </div>
                        </div>
                        <div class="h-[550px] overflow-y-auto custom-scroll">
                            <table class="w-full text-left text-xs border-collapse">
                                <thead class="bg-slate-50 sticky top-0 z-10 shadow-sm">
                                    <tr class="text-slate-400 font-bold uppercase tracking-tighter">
                                        <th class="p-6 border-b">품명 / 제품 스펙</th>
                                        <th class="p-6 border-b text-center w-20">단위</th>
                                        <th class="p-6 border-b text-right w-32">단가(원)</th>
                                        <th class="p-6 border-b text-center w-24">산출로직</th>
                                        <th class="p-6 border-b text-center w-20">추가</th>
                                    </tr>
                                </thead>
                                <tbody id="db-tbody" class="divide-y divide-slate-100"></tbody>
                            </table>
                        </div>
                    </div>

                    <!-- 미팅 모드 컨텐츠 -->
                    <div id="meeting-mode-content" class="hidden">
                        <div class="h-[600px] overflow-y-auto custom-scroll p-6">
                            <div id="meeting-form" class="space-y-5">
                                <p class="text-slate-400 italic text-center py-20">미팅 시트가 준비 중입니다. 현재는 마스터 DB 모드(02)를 이용해 주세요.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 오른쪽: 직원 전용 실시간 견적 사이드바 -->
            <div class="lg:col-span-4 space-y-6">
                <!-- 영업 분석 어드바이저 -->
                <div class="bg-slate-900 rounded-[2rem] p-8 text-white shadow-2xl relative overflow-hidden">
                    <div class="absolute -top-4 -right-4 opacity-10 font-black text-8xl italic">AI</div>
                    <h3 class="text-xl font-black mb-4 flex items-center italic text-blue-500">Sales Intelligence</h3>
                    <div id="ai-response" class="text-xs text-slate-300 leading-relaxed mb-6 h-[100px] overflow-y-auto italic border-l-2 border-orange-500/30 pl-4">항목을 추가하면 실시간 마진과 위험 요소 분석이 시작됩니다.</div>
                    <button onclick="app.requestAiAnalysis()" id="ai-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-2xl shadow-xl transition-all text-xs">상담 분석 리포트 생성</button>
                </div>

                <!-- 실시간 선택 리스트 & 공간별 요약 -->
                <div class="bg-white rounded-[2.5rem] shadow-xl border border-slate-200 overflow-hidden sticky top-24">
                    <div class="p-8 bg-blue-600 text-white flex justify-between items-end">
                        <div class="min-w-0">
                            <div class="text-[10px] font-bold opacity-60 uppercase tracking-widest mb-1">Current Total</div>
                            <div id="side-total" class="text-3xl font-black italic truncate">0원</div>
                        </div>
                        <div class="text-right shrink-0">
                            <div class="text-[10px] font-bold opacity-60 uppercase mb-1">Items</div>
                            <div id="side-count" class="text-2xl font-black">0</div>
                        </div>
                    </div>

                    <div class="p-4 space-y-4">
                        <!-- [영업 핵심] 공간별 요약 카드 -->
                        <div id="room-summary-grid" class="grid grid-cols-2 gap-3 mb-2"></div>

                        <!-- 선택 리스트 -->
                        <div id="selected-list" class="max-h-[300px] overflow-y-auto custom-scroll space-y-3 bg-slate-50/50 p-2 rounded-2xl border border-slate-100"></div>

                        <!-- [실수 방지] Validation 알림 -->
                        <div id="validation-warning" class="hidden p-4 bg-red-50 border-2 border-red-100 rounded-2xl fade-in">
                            <div class="flex items-start gap-3">
                                <span class="text-red-500 font-bold text-xl leading-none">⚠️</span>
                                <span id="warning-text" class="text-red-700 text-[10px] font-black leading-tight pt-0.5"></span>
                            </div>
                        </div>

                        <!-- [클로징용] 예산 역산기 -->
                        <button onclick="app.suggestBudgetOptimization()" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-black py-4 rounded-2xl shadow-lg transition-all text-xs flex items-center justify-center gap-2 group">
                            <span>💡 예산 초과분 자동 역산 (Downgrade)</span>
                            <span class="opacity-0 group-hover:opacity-100 transition-opacity">→</span>
                        </button>
                    </div>

                    <div class="p-6 bg-white border-t flex justify-center"><div class="h-[140px] w-full"><canvas id="budgetChart"></canvas></div></div>
                </div>
            </div>
        </main>
    </div>

    <!-- 인쇄용 내역서 레이아웃 (생략 가능하나 구조 유지) -->
    <div id="print-container" class="hidden"></div>

    <script>
        const app = {
            sheetUrl: "https://docs.google.com/spreadsheets/d/e/2PACX-1vT07Uf0iXXGQsjaIkcvhQmY0vJT2KvKBLDXucGKWja8kxLMDwyvrlhlMqBZCEjVh87JxVbzD2p0oQLw/pub?output=csv",
            MASTER_DB: [],
            selectedItems: [],
            basePrices: new Map(),
            activeCategory: "가설/철거",
            areaType: 'normal',
            debounceTimers: {},
            orderCriteria: ["가설/철거", "전기 공사", "창호 공사", "설비 공사", "방수/미장 공사", "확장/단열 공사", "목공사", "도어 공사", "타일 공사", "도배 공사", "마루 공사", "욕실 공사", "도장 공사", "필름 공사", "가구 공사", "에어컨 공사", "마감 공사", "기타 공사"],
            
            // 영업용 공간 매핑 설정
            roomConfigs: {
                "거실/복도": { cats: ["마루 공사", "도배 공사", "전기 공사", "목공사", "도장 공사"], icon: "🛋️" },
                "주방/식당": { cats: ["가구 공사", "타일 공사", "설비 공사"], icon: "🍳" },
                "욕실/방수": { cats: ["욕실 공사", "타일 공사", "방수/미장 공사"], icon: "🛁" },
                "공통/철거": { cats: ["가설/철거", "창호 공사", "도어 공사", "필름 공사", "기타 공사"], icon: "🏠" }
            },
            
            // 누락 방지 종속성 데이터
            dependencyMap: [
                { trigger: "마루 공사", target: "마루 철거", msg: "마루 시공 시 '마루 철거' 항목을 확인해 주세요." },
                { trigger: "타일 공사", target: "철거", msg: "타일 공정 시 기존 타일의 '덧방 vs 철거' 여부를 확인하세요." },
                { trigger: "시스템 에어컨", target: "단내림", msg: "시스템 에어컨 설치 시 '목공 단내림' 공정이 필요한지 체크하세요." }
            ]
        };

        const utils = {
            debounce(func, wait = 300) { return (...args) => { clearTimeout(app.debounceTimers[func.name]); app.debounceTimers[func.name] = setTimeout(() => func.apply(this, args), wait); }; },
            safeParseInt(str, def = 0) { return parseInt(String(str).replace(/[^0-9]/g, '')) || def; },
            safeParseFloat(str, def = 0) { return parseFloat(String(str)) || def; },
            parseCSV(text) { 
                const rows = []; let currentRow = []; let currentField = ''; let inQuotes = false;
                for (let i = 0; i < text.length; i++) {
                    const char = text[i];
                    if (char === '"') { inQuotes = !inQuotes; }
                    else if (char === ',' && !inQuotes) { currentRow.push(currentField.trim()); currentField = ''; }
                    else if ((char === '\n' || char === '\r') && !inQuotes) {
                        if (currentField || currentRow.length > 0) { currentRow.push(currentField.trim()); rows.push(currentRow); currentRow = []; currentField = ''; }
                    } else { currentField += char; }
                }
                return rows;
            }
        };

        // ==================== 핵심 계산 로직 (v13.0) ====================
        const calculationLogic = {
            calculateQuantity(item, py, areaType) {
                const logic = item.logic;
                if (py <= 0) return 1;

                // 면적 타입 할증 (확장형 15% 할증)
                const typeMult = { normal: 1.0, extended: 1.15 }[areaType] || 1.0;
                const adjPy = py * typeMult;

                const logicMap = {
                    "FIXED": () => 1,
                    "_FIXED": () => 1, // 단가에 평수가 이미 곱해짐
                    "PY_GEN": () => adjPy, // 가설/관리비 (1:1)
                    "PY_FLR": () => Math.ceil(adjPy * 0.75 * 1.1), // 바닥 (실면적75% * 손실률1.1)
                    "PY_WAL": () => Math.ceil(adjPy * 3.5 * 1.1),  // 벽면 (벽면적3.5 * 손실률1.1)
                    "PY_MOLD": () => Math.ceil(adjPy * 1.2),       // 몰딩류
                    "LBR_D_15": () => Math.ceil((adjPy * 3.5) / 15), // 도배공 인원(15평당 1인)
                    "MANUAL": () => 1
                };

                return (logicMap[logic] ? logicMap[logic]() : 1);
            },

            calculatePrice(item, py) {
                const pyPrice = utils.safeParseFloat(item.pyPrice);
                if (item.logic === "_FIXED" && pyPrice > 0) {
                    return pyPrice * py; // 시트의 평당 단가 자동 곱셈
                }
                return utils.safeParseFloat(item.price);
            }
        };

        // ==================== 영업 지원 UI 로직 ====================

        // 1. 공간별 요약 카드 렌더링
        app.renderRoomCards = function() {
            const grid = document.getElementById('room-summary-grid');
            if (!grid) return;

            let html = '';
            Object.keys(app.roomConfigs).forEach(roomName => {
                const config = app.roomConfigs[roomName];
                const total = app.selectedItems
                    .filter(item => config.cats.includes(item.cat))
                    .reduce((sum, item) => sum + (item.price * item.qty), 0);

                if (total > 0) {
                    html += `
                        <div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm room-card fade-in">
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-[10px] font-black text-slate-400 uppercase">${roomName}</span>
                                <span class="text-xs">${config.icon}</span>
                            </div>
                            <div class="text-[13px] font-black text-blue-700">${total.toLocaleString()}원</div>
                        </div>`;
                }
            });
            grid.innerHTML = html;
        };

        // 2. 견적 누락/오류 실시간 검증
        app.checkValidation = function() {
            const warningDiv = document.getElementById('validation-warning');
            const warningText = document.getElementById('warning-text');
            let warnings = [];

            app.dependencyMap.forEach(dep => {
                const hasTrigger = app.selectedItems.some(i => i.cat === dep.trigger || i.name.includes(dep.trigger));
                const hasTarget = app.selectedItems.some(i => i.name.includes(dep.target));

                if (hasTrigger && !hasTarget) {
                    warnings.push(dep.msg);
                }
            });

            if (warnings.length > 0) {
                warningDiv.classList.remove('hidden');
                warningText.innerHTML = warnings.map(w => `• ${w}`).join('<br>');
            } else {
                warningDiv.classList.add('hidden');
            }
        };

        // 3. 예산 맞춤형 역산기 (Downgrade Suggestion)
        app.suggestBudgetOptimization = function() {
            const targetBudget = utils.safeParseInt(document.getElementById('meeting-budget').value);
            const currentTotal = utils.safeParseInt(document.getElementById('side-total').textContent.replace(/[^0-9]/g, ''));

            if (!targetBudget || targetBudget === 0) {
                alert("먼저 'Target Budget' 칸에 고객의 예산 목표가를 입력해 주세요.");
                return;
            }

            if (currentTotal <= targetBudget) {
                alert("현재 견적이 이미 예산 범위 내에 있습니다.");
                return;
            }

            const diff = currentTotal - targetBudget;
            if (confirm(`목표 예산 대비 약 ${diff.toLocaleString()}원이 초과되었습니다.\n\n프리미엄 자재(디아망, 원목마루 등)를 표준 등급으로 일괄 조정하여 예산을 맞춰볼까요?`)) {
                const py = utils.safeParseFloat(document.getElementById('site-size').value, 0);
                
                app.selectedItems = app.selectedItems.map(item => {
                    let replacement = null;
                    // 디아망 -> 일반 실크
                    if (item.name.includes("디아망")) {
                        replacement = app.MASTER_DB.find(m => m.name.includes("실크") && !m.name.includes("디아망"));
                    }
                    // 원목마루 -> 강마루
                    else if (item.name.includes("원목")) {
                        replacement = app.MASTER_DB.find(m => m.name.includes("강마루"));
                    }
                    // 600각 타일 -> 300*600 타일
                    else if (item.spec.includes("600*600")) {
                        replacement = app.MASTER_DB.find(m => m.spec.includes("300*600"));
                    }

                    if (replacement) {
                        return { 
                            ...replacement, 
                            qty: calculationLogic.calculateQuantity(replacement, py, app.areaType),
                            price: calculationLogic.calculatePrice(replacement, py)
                        };
                    }
                    return item;
                });
                app.updateAll();
                app.showNotification("자재 등급 하향 조정 완료", "info");
            }
        };

        // ==================== 시스템 기본 로직 ====================

        app.fetchExternalData = async function() {
            const btn = document.getElementById('sync-btn');
            btn.classList.add('animate-pulse');
            try {
                const response = await fetch(app.sheetUrl);
                const csvText = await response.text();
                const rows = utils.parseCSV(csvText);
                app.MASTER_DB = rows.slice(1).map((cols, idx) => ({
                    id: "ITEM_" + idx,
                    cat: cols[0], name: cols[1], spec: cols[2], unit: cols[3], 
                    price: cols[4], logic: cols[5], lTxt: cols[6], pyPrice: cols[8], note: cols[11]
                }));
                app.renderTabs();
                app.renderDB();
                document.getElementById('sync-status').classList.remove('hidden');
                app.showNotification("최신 DB 동기화 완료", "success");
            } catch (e) { 
                app.showNotification("DB 동기화 실패", "error"); 
            } finally {
                btn.classList.remove('animate-pulse');
            }
        };

        app.addItem = function(id) {
            const item = app.MASTER_DB.find(i => i.id === id);
            if (!item || app.selectedItems.some(s => s.id === id)) return;

            const py = utils.safeParseFloat(document.getElementById('site-size').value, 0);
            const qty = calculationLogic.calculateQuantity(item, py, app.areaType);
            const price = calculationLogic.calculatePrice(item, py);

            app.selectedItems.push({ ...item, qty, price });
            app.updateAll();
            app.showNotification(`${item.name} 추가됨`, "success");
        };

        app.updateAll = function() {
            app.updateDashboard();
            app.updateChart();
            app.renderRoomCards();
            app.checkValidation();
        };

        app.updateDashboard = function() {
            const list = document.getElementById('selected-list');
            let directTotal = 0;
            
            list.innerHTML = app.selectedItems.map(item => {
                const sub = item.price * item.qty;
                directTotal += sub;
                return `
                    <div class="flex justify-between items-center p-3 bg-white border border-slate-100 rounded-xl shadow-sm m-card fade-in">
                        <div class="min-w-0 pr-2">
                            <div class="text-[8px] font-black text-blue-500 uppercase">${item.cat}</div>
                            <div class="text-[11px] font-bold truncate text-slate-800">${item.name}</div>
                        </div>
                        <div class="flex items-center space-x-2 shrink-0">
                            <div class="text-[11px] font-black text-slate-900">${Math.round(sub).toLocaleString()}원</div>
                            <button onclick="app.removeItem('${item.id}')" class="text-slate-300 hover:text-red-500 ml-1">✕</button>
                        </div>
                    </div>`;
            }).join('');

            const rateExp = utils.safeParseFloat(document.getElementById('rate-exp').value, 5);
            const rateProfit = utils.safeParseFloat(document.getElementById('rate-profit').value, 10);
            const adjust = utils.safeParseInt(document.getElementById('val-adjust').value, 0);
            const total = (directTotal * (1 + (rateExp + rateProfit)/100)) + adjust;
            
            const totalStr = Math.round(total).toLocaleString() + '원';
            document.getElementById('side-total').textContent = totalStr;
            document.getElementById('nav-total').textContent = totalStr;
            document.getElementById('side-count').textContent = app.selectedItems.length;
        };

        app.removeItem = function(id) {
            app.selectedItems = app.selectedItems.filter(i => i.id !== id);
            app.updateAll();
        };

        app.setAreaType = function(type) {
            app.areaType = type;
            document.querySelectorAll('.area-type-btn').forEach(btn => {
                btn.classList.remove('active', 'bg-blue-500', 'text-white');
                btn.classList.add('bg-white', 'text-slate-600');
            });
            document.getElementById('area-type-' + type).classList.add('active', 'bg-blue-500', 'text-white');
            app.syncAutoCalculations();
        };

        app.syncAutoCalculations = function() {
            const py = utils.safeParseFloat(document.getElementById('site-size').value, 0);
            const actualPy = py * (app.areaType === 'extended' ? 1.15 : 1.0);
            document.getElementById('actual-size-display').textContent = actualPy.toFixed(1);
            
            app.selectedItems.forEach(item => {
                item.qty = calculationLogic.calculateQuantity(item, py, app.areaType);
                item.price = calculationLogic.calculatePrice(item, py);
            });
            app.updateAll();
        };

        app.renderTabs = function() {
            const container = document.getElementById('search-mode-tabs');
            const cats = [...new Set(app.MASTER_DB.map(i => i.cat))].sort((a,b) => app.orderCriteria.indexOf(a) - app.orderCriteria.indexOf(b));
            container.innerHTML = cats.map(c => `
                <button onclick="app.activeCategory='${c}'; app.renderTabs(); app.renderDB();" class="category-tab px-4 py-2 rounded-xl text-[10px] font-black border transition-all shrink-0 ${app.activeCategory === c ? 'active' : 'bg-white text-slate-500 border-slate-200'}">${c}</button>
            `).join('');
        };

        app.renderDB = function() {
            const tbody = document.getElementById('db-tbody');
            document.getElementById('active-cat-name').textContent = app.activeCategory;
            const search = (document.getElementById('db-search').value || "").toLowerCase();
            const filtered = app.MASTER_DB.filter(i => i.cat === app.activeCategory && (i.name.toLowerCase().includes(search) || i.spec.toLowerCase().includes(search)));
            
            tbody.innerHTML = filtered.map(item => `
                <tr class="hover:bg-blue-50 transition cursor-pointer" onclick="app.addItem('${item.id}')">
                    <td class="p-6">
                        <div class="font-bold text-slate-800 text-sm">${item.name}</div>
                        <div class="text-[10px] text-slate-500 leading-tight mt-1">${item.spec}</div>
                    </td>
                    <td class="p-6 text-center text-slate-500 font-bold">${item.unit}</td>
                    <td class="p-6 text-right font-black text-blue-900">${utils.safeParseFloat(item.price).toLocaleString()}</td>
                    <td class="p-6 text-center"><span class="bg-slate-100 px-2 py-1 rounded text-[9px] font-black text-slate-600">${item.lTxt}</span></td>
                    <td class="p-6 text-center"><button class="bg-blue-600 text-white w-8 h-8 rounded-xl font-bold shadow-sm hover:bg-blue-700 transition-colors">＋</button></td>
                </tr>`).join('');
        };

        app.requestAiAnalysis = function() {
            const aiBox = document.getElementById('ai-response');
            aiBox.innerHTML = "<span class='animate-pulse'>데이터 분석 중...</span>";
            setTimeout(() => {
                const total = document.getElementById('side-total').textContent;
                aiBox.innerHTML = `현재 견적 총액은 <strong class="text-blue-400">${total}</strong>입니다. 평당 시공비가 적정 수준이며, 주요 마감재 누락이 발견되지 않았습니다. <br><br> <span class="text-orange-400 font-bold">💡 Tip:</span> 고급 벽지 비중이 높습니다. 예산 절충 시 거실만 디아망으로 유지하고 방은 일반 실크로 제안해 보세요.`;
            }, 1000);
        };

        app.showNotification = function(msg, type) { 
            const n = document.createElement('div');
            n.className = `fixed top-20 right-4 ${type === 'success' ? 'bg-green-500' : (type === 'error' ? 'bg-red-500' : 'bg-blue-600')} text-white px-6 py-3 rounded-2xl shadow-2xl z-50 fade-in font-bold text-xs`;
            n.textContent = msg; document.body.appendChild(n);
            setTimeout(() => n.remove(), 3000);
        };

        app.initChart = function() {
            const ctx = document.getElementById('budgetChart').getContext('2d');
            app.budgetChart = new Chart(ctx, { 
                type: 'doughnut', 
                data: { labels: [], datasets: [{ data: [], backgroundColor: ['#0f172a', '#2563eb', '#f97316', '#10b981', '#6366f1', '#ec4899'], borderWidth: 0 }] }, 
                options: { cutout: '80%', plugins: { legend: { display: false } }, maintainAspectRatio: false } 
            });
        };

        app.updateChart = function() {
            if (!app.budgetChart) return;
            const cats = {}; 
            app.selectedItems.forEach(i => cats[i.cat] = (cats[i.cat] || 0) + (i.price * i.qty));
            app.budgetChart.data.labels = Object.keys(cats);
            app.budgetChart.data.datasets[0].data = Object.values(cats); 
            app.budgetChart.update();
        };

        app.switchMode = (mode) => {
            document.getElementById('search-mode-content').classList.toggle('hidden', mode !== 'search');
            document.getElementById('meeting-mode-content').classList.toggle('hidden', mode !== 'meeting');
            document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active', 'bg-blue-600', 'text-white'));
            document.getElementById('mode-' + mode).classList.add('active');
        };

        // 초기화
        window.onload = () => { 
            app.initChart(); 
            app.fetchExternalData();
            // 기본 평수 32평 세팅 예시
            document.getElementById('site-size').value = 32;
            app.syncAutoCalculations();
        };
        app.debounceUpdate = utils.debounce(app.updateAll);
        app.debounceRenderDB = utils.debounce(app.renderDB);
    </script>
</body>
</html>
